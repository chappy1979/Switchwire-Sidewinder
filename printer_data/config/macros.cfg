############################################################################
############################  Start Print   ################################
############################################################################

[gcode_macro START_PRINT]
description: Phased start-print macro for Orca Slicer with adaptive mesh & purge
variable_state: "Prepare"
gcode:
    {% set BED = params.BED|default(60)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|int %}

    {action_respond_info("START_PRINT: Starting print in phased mode...")}

    _PRINT_START_PHASE_INIT BED={BED} EXTRUDER={EXTRUDER}
    _PRINT_START_PHASE_PREHEAT BED={BED} EXTRUDER=160
    _PRINT_START_PHASE_LEVEL BED={BED}
    _PRINT_START_PHASE_POSITION
    _PRINT_START_PHASE_PURGE_EXTRUDER EXTRUDER={EXTRUDER}

    # Optional tuning AFTER purge
     SET_VELOCITY_LIMIT VELOCITY=400 ACCEL=3500 SQUARE_CORNER_VELOCITY=5.0

[gcode_macro _PRINT_START_PHASE_INIT]
gcode:
    {% set BED = params.BED|int %}
    {% set EXTRUDER = params.EXTRUDER|int %}

    {action_respond_info("Phase: INIT - clearing pause and starting bed heat")}
    CLEAR_PAUSE
    M107
    G90
    M83
    G92 E0

    M140 S{BED}
    M104 S0

    BED_MESH_CLEAR

    {action_respond_info("Phase: INIT complete")}

[gcode_macro _PRINT_START_PHASE_PREHEAT]
gcode:
    {% set BED = params.BED|int %}

    {action_respond_info("Phase: PREHEAT - homing")}
    G28

    M117 Heating bed...
    M190 S{BED}

    M117 Preheating nozzle...
    M104 S160

    {action_respond_info("Phase: PREHEAT complete")}

[gcode_macro _PRINT_START_PHASE_LEVEL]
gcode:
    {% set BED = params.BED|int %}

    {action_respond_info("Phase: LEVEL - adaptive mesh")}

    M117 Adaptive Mesh...

    BED_MESH_CALIBRATE ADAPTIVE=1

    {action_respond_info("Phase: LEVEL complete")}

[gcode_macro _PRINT_START_PHASE_POSITION]
gcode:
    {action_respond_info("Phase: POSITION - purge move")}

    G90
    G92 E0
    G1 X205 Y2 F6000
    G1 Z0.6 F3000

[gcode_macro _PRINT_START_PHASE_PURGE_EXTRUDER]
gcode:
    {% set EXTRUDER = params.EXTRUDER|int %}

    {action_respond_info("Phase: PURGE - heating nozzle final")}

    M109 S{EXTRUDER}

    M117 Purging...

    G1 Z0.40 F1000   #war Z0.28

    G1 X95 Y2 E12 F1000
    G1 Y2.4 F5000
    G1 X205 Y2.4 E12 F1000

    G92 E0
    G1 E-0.8 F2400
    G1 Z1 F3000

    M117 Printing...
    {action_respond_info("Phase: PURGE complete")}

############################################################################
############################   End Print    ################################
############################################################################  

[gcode_macro PRINT_END]
description: End the print and park the toolhead
gcode:
    M117 Print Ending...

    # Z Sicherheit
    G91
    G1 Z5 F300
    G90

    # Parkposition
    PARK

    # Heizer ausschalten
    M104 S0
    M140 S0
    M106 S0

    # Optional: Bett in Ruhe lassen
    M117 Cooling...

    SET_VELOCITY_LIMIT VELOCITY=400 ACCEL=3500 SQUARE_CORNER_VELOCITY=5.0

############################################################################
#############################   Override  ##################################
############################################################################


[homing_override]
gcode:   
	G28 X
	G28 Y
	G1 X150 Y180 F3000
	G28 Z                      ; do the coarse home
    G90                        ; set absolute positioning
    G0 Z2 F1000                ; to 2mm -- home height (or whatever you'd like), for maximum sensor accuracy
    G4 S1                      ; chill for a sec
    M400                       ; wait for move to finish
	PROBE METHOD=tap
    PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1 ; read the current exact height from sensor and home Z to it
    G0 Z5 F1000 ; to 5mm as home



############################################################################
##############   Park - Cancel - Resume - Paus Print    ####################
############################################################################  

[gcode_macro CANCEL_PRINT]
description: Cancel the current print
gcode:
    M117 Cancelling...

    # Z Sicherheit
    G91
    G1 Z10 F300
    G90

    # Parken
    PARK

    # Alles ausschalten
    M104 S0
    M140 S0
    M106 S0

    CLEAR_PAUSE
    M84

    M117 Print cancelled

     # Deine gewünschte Zeile:
    SET_VELOCITY_LIMIT VELOCITY=400 ACCEL=3500 SQUARE_CORNER_VELOCITY=5.0

[gcode_macro PAUSE]
description: Pause the current print
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state

    M117 Pausing...

    G91
    G1 E-2 F2100      ; kleiner Retract
    G1 Z10 F300       ; Z hoch
    G90

    PARK

[gcode_macro RESUME]
description: Resume the paused print
gcode:
    M117 Resuming...

    # Filament wieder rein
    G91
    G1 E2 F2100
    G90

    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1

############################################################################
#############################   Mouvments   ################################
############################################################################

[gcode_macro SMARTHOME]
gcode:
    {% if printer.toolhead.homed_axes == "xyz" %}
    {% else %}
        G28
    {% endif %}

[gcode_macro MOVE_TO_NEUTRAL_POSITION]
gcode:
  g90; set to absolute positioning
  SMARTHOME
  g1 x155 y160 f9000
  g1 z150 f3000

[gcode_macro PARK]
description: Park the toolhead in the back-right corner
gcode:
    # Anheben für Sicherheit
    G91
    G1 Z5 F300
    G90

    # Parkposition hinten links
    G1 X10 Y320 F6000

############################################################################
############################### Z Stepper   ################################
############################################################################

[gcode_macro LOCK_Z_STEPPERS]
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1

[gcode_macro UN_LOCK_Z_STEPPERS]
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0  
  
############################################################################
###############################   PID    ###################################
############################################################################

[gcode_macro PID_EXTRUDER]
gcode:
 M106 S255
 {% set TARGET_TEMP = params.TARGET_TEMP|default(210)|float %} 
 PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP}

[gcode_macro PID_BED]
gcode:
 {%set TARGET_TEMP = params.TARGET_TEMP|default(60)|float %}
 PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP}

############################################################################
############################### Bett Macros ################################
############################################################################

[gcode_macro BED_LEVEL]
gcode:
  G28
  SCREWS_TILT_CALCULATE 

