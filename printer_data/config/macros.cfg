############################################################################
###############################  Filamant   ################################
############################################################################

[gcode_macro FILAMENT_UNLOAD]
gcode:
 MOVE_TO_NEUTRAL_POSITION
 M109 S220
 M83
 G92 E0.0
 G1 E-100 F500
 G92 E0.0
 M82

[gcode_macro FILAMENT_LOAD]
gcode:
 MOVE_TO_NEUTRAL_POSITION
 M109 S220
 M83
 G92 E0.0
 G1 E125 F150
 G1 E-3 F2400
 G92 E0.0
 M82

############################################################################
############################### EDDY Macros ################################
############################################################################

# Uncomment this if you are using Eddy as the probe AND the homing endstop AND would like to use the beta z-offset control
[save_variables]
filename: ~/printer_data/config/variables.cfg


[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(0)|float %}

    {action_respond_info("Check Heating!")}
    {% if printer.heater_bed.temperature != BED_TEMP %}
        M140 S{BED_TEMP}
        {action_respond_info("The bed target temperature was not reached!")}
        {action_respond_info("Bed heating...")}
        M190 S{BED_TEMP}
    {% endif %}

    {% if printer.toolhead.homed_axes|lower != "xyz" %}
        G28
    {% endif %}

    BED_MESH_CLEAR
    
    BED_MESH_CALIBRATE_BASE ADAPTIVE=1  #BED_MESH_CALIBRATE_BASE

    {% if printer.heater_bed.target == 0 %}
        M140 S0  
    {% endif %}


#This macro is optional but useful if you want to run a rapid scan before each print. Simply uncomment it and add BED_MESH_SCAN to your print start code.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
  #SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True #Only uncomment this line if using a KNOMI and then remove the BED_MESH_CALIBRATE macro from KNOMI.cfg
  BTT_BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan
  #SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False #Only uncomment this line if using a KNOMI and then remove the BED_MESH_CALIBRATE macro from KNOMI.cfg


